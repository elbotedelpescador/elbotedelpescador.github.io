<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Bote del Pescador · Catálogo</title>
<meta name="description" content="Catálogo de pesca y camping de El Bote del Pescador. Consultá precio y disponibilidad por WhatsApp.">
<meta name="theme-color" content="#ff8f33">
<link rel="icon" href="logo.png">
<!--
  Catálogo para clientes de El Bote del Pescador. Lo genera el ERP
  (services/catalogo_publico.py): esta página lee datos.json. No lleva
  precios ni stock a propósito.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
<style>
  /* Paleta sacada del logo oficial: atardecer naranja → ámbar, y negro. */
  :root {
    --fondo: #fdf7ef;
    --papel: #ffffff;
    --tinta: #1a1410;
    --tenue: #6e6257;
    --linea: #efe3d3;
    --naranja: #ff681a;
    --ambar: #ffba4f;
    --acento: #c2410c;      /* naranja oscuro: legible como texto sobre blanco */
    --wsp: #1f8f4e;
    --titulos: "Bree Serif", Georgia, serif;
    --sombra: 0 1px 2px rgba(60, 30, 10, .06), 0 6px 18px rgba(60, 30, 10, .07);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button { font: inherit; color: inherit; }
  img { display: block; }

  /* Encabezado: el atardecer del logo con el agua abajo */
  .cabecera { position: relative; text-align: center; }
  .cielo {
    height: 132px; position: relative; overflow: hidden;
    background: radial-gradient(120% 170% at 50% 115%, #ff5a12 0%, var(--naranja) 22%, #ff8f33 45%, var(--ambar) 72%, #ffd58a 100%);
  }
  .cielo svg { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 46px; }
  .logo {
    width: 148px; height: 148px; margin: -96px auto 0; position: relative; border-radius: 50%;
    background: var(--fondo); padding: 5px; box-shadow: 0 8px 24px rgba(120, 50, 10, .25);
  }
  .logo img { width: 100%; height: 100%; }
  .bajada { margin: 12px 16px 0; font-size: 14px; color: var(--tenue); }
  .bajada strong { display: block; font-family: var(--titulos); font-weight: 400; font-size: 19px; color: var(--tinta); margin-bottom: 2px; }

  /* Buscador y categorías (quedan fijos arriba al bajar) */
  .barra {
    position: sticky; top: 0; z-index: 5; background: var(--fondo);
    padding: 12px 16px 8px; border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s;
  }
  .barra.pegada { border-bottom-color: var(--linea); box-shadow: 0 6px 16px rgba(60, 30, 10, .06); }
  .buscador { position: relative; max-width: 720px; margin: 0 auto; }
  .buscador svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--acento); pointer-events: none; }
  .buscador input {
    width: 100%; height: 48px; padding: 0 44px 0 42px; border-radius: 999px;
    border: 1.5px solid var(--linea); background: var(--papel); color: var(--tinta);
    font: inherit; font-size: 16px; outline: none; box-shadow: var(--sombra);
  }
  .buscador input::placeholder { color: #a39686; }
  .buscador input:focus { border-color: var(--naranja); box-shadow: 0 0 0 4px rgba(255, 104, 26, .18); }
  .buscador .limpiar {
    position: absolute; right: 7px; top: 50%; translate: 0 -50%; width: 34px; height: 34px;
    border: 0; border-radius: 50%; background: var(--fondo); color: var(--tenue); cursor: pointer; font-size: 20px;
  }
  /* Categorías: en el celular, botón que despliega la lista vertical;
     en pantallas anchas, todas a la vista. */
  .cat-boton {
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 720px; margin: 10px auto 0;
    height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--linea);
    background: var(--papel); cursor: pointer; font-size: 15px; box-shadow: var(--sombra);
  }
  .cat-boton .rotulo { color: var(--tenue); }
  .cat-boton .actual { font-weight: 600; flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-boton .flecha { color: var(--acento); transition: rotate .2s; }
  .cat-boton[aria-expanded="true"] { border-color: var(--naranja); }
  .cat-boton[aria-expanded="true"] .flecha { rotate: 180deg; }
  .chips {
    display: none; flex-direction: column; max-width: 720px; margin: 8px auto 0; background: var(--papel);
    border: 1px solid var(--linea); border-radius: 18px; box-shadow: 0 12px 30px rgba(60, 30, 10, .16);
    max-height: 62dvh; overflow-y: auto; overscroll-behavior: contain;
  }
  .chips.abierta { display: flex; }
  .chip {
    display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    border: 0; border-bottom: 1px solid var(--linea); background: transparent; padding: 14px 18px;
    font-size: 15.5px; cursor: pointer;
  }
  .chip:last-child { border-bottom: 0; }
  .chip span { color: var(--tenue); font-size: 13px; background: var(--fondo); border-radius: 999px; padding: 2px 9px; }
  .chip[aria-pressed="true"] { background: #fff3e2; color: var(--acento); font-weight: 700; }
  .chip[aria-pressed="true"] span { background: var(--naranja); color: #fff; }
  @media (min-width: 900px) {
    .cat-boton { display: none; }
    .chips {
      display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1100px;
      margin: 12px auto 0; background: none; border: 0; box-shadow: none; max-height: none; overflow: visible;
    }
    .chip {
      width: auto; border: 1.5px solid var(--linea); border-radius: 999px; background: var(--papel);
      padding: 7px 14px; font-size: 13.5px; gap: 6px;
    }
    .chip:last-child { border-bottom: 1.5px solid var(--linea); }
    .chip:hover { border-color: var(--ambar); }
    .chip span { background: none; padding: 0; font-size: 12px; }
    .chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: #fff; font-weight: 400; }
    .chip[aria-pressed="true"] span { background: none; color: var(--ambar); }
  }

  /* Grilla de productos */
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
  .contador { color: var(--tenue); font-size: 13px; margin: 6px 2px 12px; }
  .grilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; list-style: none; padding: 0; margin: 0; }
  @media (min-width: 640px) { .grilla { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
  @media (min-width: 960px) { .grilla { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tarjeta {
    width: 100%; height: 100%; text-align: left; padding: 0; border: 1px solid var(--linea); border-radius: 16px;
    background: var(--papel); overflow: hidden; cursor: pointer; box-shadow: var(--sombra);
    display: flex; flex-direction: column; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .tarjeta:hover { border-color: var(--ambar); box-shadow: 0 10px 26px rgba(120, 50, 10, .12); }
  .tarjeta:active { transform: scale(.98); }
  .foto { aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; position: relative; }
  .cant-fotos {
    position: absolute; right: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px;
    background: rgba(26, 20, 16, .72); color: #fff; font-size: 11.5px; font-weight: 600;
    border-radius: 999px; padding: 3px 8px 3px 7px; pointer-events: none;
  }
  .cant-fotos svg { width: 13px; height: 13px; }
  .foto img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .sin-foto {
    width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #fff6e8, #ffefd9); color: #c79a66; font-size: 12px; text-align: center; padding: 8px;
  }
  .sin-foto img { width: 46px; height: 46px; opacity: .35; filter: grayscale(1); }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; border-top: 1px solid var(--linea); }
  .marca { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--acento); font-weight: 700; }
  .nombre {
    font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sku { margin-top: auto; padding-top: 5px; font-size: 11.5px; color: var(--tenue); }
  .vacio { text-align: center; color: var(--tenue); padding: 40px 10px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .vacio .boton { margin-top: 12px; }
  .mas { display: block; margin: 20px auto 0; }

  .boton {
    border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .boton.claro { background: var(--papel); border: 1.5px solid var(--linea); color: var(--tinta); }
  .boton.wsp { background: var(--wsp); color: #fff; }
  .boton.wsp:active { filter: brightness(.92); }

  /* Botón flotante de WhatsApp */
  .flotante {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .22); padding: 13px 18px;
  }

  /* Ficha del producto */
  dialog {
    border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 92dvh; border-radius: 22px 22px 0 0;
    margin: auto auto 0; background: var(--papel); color: var(--tinta); overflow: hidden;
  }
  @media (min-width: 640px) { dialog { border-radius: 22px; margin: auto; } }
  dialog::backdrop { background: rgba(26, 20, 16, .55); }
  dialog[open] { animation: subir .22s ease-out; display: flex; flex-direction: column; }
  @keyframes subir { from { transform: translateY(30px); opacity: 0; } }
  .ficha-cuerpo { overflow-y: auto; }
  .ficha-foto { background: #fff; aspect-ratio: 4 / 3; position: relative; border-bottom: 1px solid var(--linea); }
  .ficha-foto > img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
  /* Varias fotos: se desliza con el dedo (o flechas en la compu). */
  .galeria {
    display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .galeria::-webkit-scrollbar { display: none; }
  .galeria img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; padding: 12px; scroll-snap-align: center; }
  .fl-foto {
    position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: rgba(255, 255, 255, .95); box-shadow: var(--sombra); cursor: pointer;
    font-size: 22px; line-height: 1; color: var(--tinta); display: none;
  }
  .fl-foto.ant { left: 8px; } .fl-foto.sig { right: 8px; }
  @media (hover: hover) { .ficha-foto.varias .fl-foto { display: block; } }
  .fl-foto[disabled] { opacity: .3; cursor: default; }
  .puntos { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .puntos span { width: 7px; height: 7px; border-radius: 50%; background: rgba(26, 20, 16, .25); transition: background .2s, transform .2s; }
  .puntos span.activo { background: var(--acento, #c2410c); transform: scale(1.25); }
  .miniaturas { display: flex; gap: 8px; overflow-x: auto; padding: 10px 18px 0; scrollbar-width: none; }
  .miniaturas::-webkit-scrollbar { display: none; }
  .miniaturas button {
    flex: 0 0 auto; width: 58px; height: 58px; padding: 3px; border-radius: 10px; background: #fff;
    border: 2px solid var(--linea); cursor: pointer;
  }
  .miniaturas button.activo { border-color: var(--acento, #c2410c); }
  .miniaturas img { width: 100%; height: 100%; object-fit: contain; }
  .cerrar {
    position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(255, 255, 255, .95); box-shadow: var(--sombra); cursor: pointer; font-size: 22px; line-height: 1;
  }
  .ficha-texto { padding: 16px 18px 6px; }
  .ficha-texto h2 { margin: 4px 0 8px; font-family: var(--titulos); font-weight: 400; font-size: 21px; line-height: 1.25; }
  .datos { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--tenue); margin-bottom: 12px; }
  .datos span { background: var(--fondo); border: 1px solid var(--linea); border-radius: 999px; padding: 3px 10px; }
  .caracteristicas { white-space: pre-line; font-size: 14.5px; margin: 0 0 8px; }
  .aviso {
    font-size: 13px; color: #7a3d12; background: linear-gradient(90deg, #fff1de, #ffe9cc); border-radius: 12px;
    padding: 10px 12px; margin: 4px 0 6px;
  }
  .ficha-pie { padding: 12px 18px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linea); }
  .ficha-pie .boton { width: 100%; font-size: 16px; padding: 14px; }

  /* Pie */
  footer {
    background: var(--tinta); color: #d9cdbf; text-align: center; font-size: 13px; line-height: 1.7;
    padding: 30px 16px calc(90px + env(safe-area-inset-bottom)); margin-top: 20px;
  }
  footer img { width: 72px; height: 72px; margin: 0 auto 10px; }
  footer .nombre-local { font-family: var(--titulos); font-size: 18px; color: var(--ambar); }
  footer a { color: #fff; }
  footer .actualizado { color: #8f8275; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<header class="cabecera">
  <div class="cielo" aria-hidden="true">
    <svg viewBox="0 0 1200 46" preserveAspectRatio="none"><path d="M0 22 C 150 4 300 40 450 22 S 750 4 900 22 S 1100 40 1200 20 V46 H0Z" fill="#fdf7ef"/><path d="M0 30 C 200 18 350 42 600 30 S 1000 18 1200 32" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/></svg>
  </div>
  <div class="logo"><img src="logo.png" alt="El Bote del Pescador — Pesca y Camping" width="300" height="300"></div>
  <p class="bajada"><strong>Catálogo de productos</strong>Consultá precio y disponibilidad por WhatsApp</p>
</header>

<div class="barra" id="barra">
  <div class="buscador">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar: anzuelo, reel, linterna, marca…" autocomplete="off" enterkeyhint="search" aria-label="Buscar productos">
    <button class="limpiar" id="limpiar" aria-label="Borrar búsqueda" hidden>×</button>
  </div>
  <button class="cat-boton" id="cat-boton" type="button" aria-expanded="false" aria-controls="chips">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span class="rotulo">Categorías:</span><span class="actual" id="cat-actual">Todo</span>
    <svg class="flecha" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <nav class="chips" id="chips" aria-label="Categorías"></nav>
</div>

<main>
  <p class="contador" id="contador">Cargando catálogo…</p>
  <ul class="grilla" id="grilla"></ul>
  <button class="boton claro mas" id="mas" hidden>Ver más productos</button>
</main>
<footer id="pie"><img src="logo.png" alt="" width="72" height="72"></footer>

<a class="boton wsp flotante" id="flotante" target="_blank" rel="noopener" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg>
  Consultas
</a>

<dialog id="ficha" aria-labelledby="ficha-nombre">
  <div class="ficha-cuerpo">
    <div class="ficha-foto" id="ficha-foto"></div>
    <div class="miniaturas" id="ficha-minis" hidden></div>
    <div class="ficha-texto">
      <div class="marca" id="ficha-marca"></div>
      <h2 id="ficha-nombre"></h2>
      <div class="datos" id="ficha-datos"></div>
      <p class="caracteristicas" id="ficha-caract"></p>
      <p class="aviso">Escribinos y te pasamos precio, disponibilidad y formas de pago.</p>
    </div>
  </div>
  <div class="ficha-pie">
    <a class="boton wsp" id="ficha-wsp" target="_blank" rel="noopener">Consultar por WhatsApp</a>
  </div>
</dialog>

<script>
(() => {
  const POR_TANDA = 40;
  const $ = (id) => document.getElementById(id);
  const estado = { datos: null, categoria: "", q: "", mostrados: POR_TANDA, lista: [] };

  // Sin tildes ni mayúsculas, para que "cana" encuentre "Caña".
  const normal = (t) => (t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  function el(tag, clase, texto) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto != null) e.textContent = texto;
    return e;
  }

  function linkWhatsapp(texto) {
    const n = estado.datos.negocio.whatsapp;
    return n ? `https://wa.me/${n}?text=${encodeURIComponent(texto)}` : null;
  }

  function fotoO(p, alt) {
    if (p.foto) {
      const img = el("img");
      img.src = p.foto; img.alt = alt || p.nombre; img.loading = "lazy"; img.decoding = "async";
      return img;
    }
    const s = el("div", "sin-foto");
    const logo = el("img"); logo.src = "logo.png"; logo.alt = ""; logo.loading = "lazy";
    s.append(logo);
    s.append(el("span", "", "Imagen no disponible"));
    return s;
  }

  function filtrar() {
    const palabras = normal(estado.q).split(/\s+/).filter(Boolean);
    estado.lista = estado.datos.productos.filter((p) =>
      (!estado.categoria || p.categoria === estado.categoria) &&
      palabras.every((w) => p._texto.includes(w)));
  }

  function dibujarChips() {
    const cuenta = {};
    estado.datos.productos.forEach((p) => { cuenta[p.categoria] = (cuenta[p.categoria] || 0) + 1; });
    const chips = $("chips");
    chips.replaceChildren();
    [["", "Todo", estado.datos.productos.length], ...estado.datos.categorias.map((c) => [c, c, cuenta[c] || 0])]
      .forEach(([valor, texto, n]) => {
        const b = el("button", "chip", texto);
        b.append(el("span", "", n));
        b.setAttribute("aria-pressed", String(estado.categoria === valor));
        b.onclick = () => {
          estado.categoria = valor;
          estado.mostrados = POR_TANDA;
          $("cat-actual").textContent = texto;
          cerrarCategorias();
          dibujarChips(); actualizar();
          // Volver al principio de la lista de productos.
          const arriba = $("contador").getBoundingClientRect().top + scrollY - $("barra").offsetHeight - 8;
          if (scrollY > arriba) scrollTo({ top: arriba, behavior: "smooth" });
        };
        chips.append(b);
      });
  }

  function tarjeta(p) {
    const li = el("li");
    const b = el("button", "tarjeta");
    b.type = "button";
    const f = el("div", "foto"); f.append(fotoO(p));
    if (p.fotos && p.fotos.length) {
      const c = el("span", "cant-fotos");
      c.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
      c.append(String(p.fotos.length + 1));
      c.title = `${p.fotos.length + 1} fotos`;
      f.append(c);
    }
    const info = el("div", "info");
    if (p.marca) info.append(el("div", "marca", p.marca));
    info.append(el("div", "nombre", p.nombre));
    if (p.sku) info.append(el("div", "sku", "Cód. " + p.sku));
    b.append(f, info);
    b.onclick = () => abrirFicha(p);
    li.append(b);
    return li;
  }

  function actualizar() {
    filtrar();
    const n = estado.lista.length;
    $("contador").textContent = n === 1 ? "1 producto" : `${n.toLocaleString("es-AR")} productos`;
    const grilla = $("grilla");
    grilla.replaceChildren(...estado.lista.slice(0, estado.mostrados).map(tarjeta));
    $("mas").hidden = estado.mostrados >= n;
    if (!n) {
      const v = el("li", "vacio");
      v.style.gridColumn = "1 / -1";
      v.append(el("div", "", "No encontramos productos con esa búsqueda."),
               el("div", "", "Igual escribinos: puede que lo tengamos o lo consigamos."));
      const link = linkWhatsapp(`Hola, quiero consultar si tienen: ${estado.q || estado.categoria}`);
      if (link) {
        const a = el("a", "boton wsp", "Consultar por WhatsApp");
        a.href = link; a.target = "_blank"; a.rel = "noopener";
        v.append(a);
      }
      grilla.append(v);
    }
  }

  function galeria(p) {
    const caja = $("ficha-foto"), minis = $("ficha-minis");
    const fotos = p.foto ? [p.foto, ...(p.fotos || [])] : [];
    caja.classList.toggle("varias", fotos.length > 1);
    minis.replaceChildren();
    minis.hidden = fotos.length < 2;
    $("ficha").onkeydown = null;
    if (fotos.length < 2) { caja.replaceChildren(fotoO(p)); return; }
    const pista = el("div", "galeria");
    fotos.forEach((src, i) => {
      const img = el("img");
      img.src = src; img.alt = `${p.nombre} (foto ${i + 1} de ${fotos.length})`; img.decoding = "async";
      if (i) img.loading = "lazy";
      pista.append(img);
    });
    const ant = el("button", "fl-foto ant", "‹"), sig = el("button", "fl-foto sig", "›");
    ant.type = sig.type = "button";
    ant.setAttribute("aria-label", "Foto anterior"); sig.setAttribute("aria-label", "Foto siguiente");
    const puntos = el("div", "puntos");
    fotos.forEach(() => puntos.append(el("span")));
    const botones = fotos.map((src, i) => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-label", `Ver foto ${i + 1}`);
      const im = el("img"); im.src = src; im.alt = ""; im.loading = "lazy";
      b.append(im); b.onclick = () => ir(i);
      return b;
    });
    minis.append(...botones);
    let actual = 0;
    const ir = (i) => pista.scrollTo({ left: i * pista.clientWidth, behavior: "smooth" });
    const marcar = () => {
      actual = Math.round(pista.scrollLeft / Math.max(pista.clientWidth, 1));
      [...puntos.children].forEach((s, i) => s.classList.toggle("activo", i === actual));
      botones.forEach((b, i) => b.classList.toggle("activo", i === actual));
      ant.disabled = actual === 0; sig.disabled = actual === fotos.length - 1;
    };
    pista.addEventListener("scroll", () => requestAnimationFrame(marcar), { passive: true });
    ant.onclick = () => ir(Math.max(actual - 1, 0));
    sig.onclick = () => ir(Math.min(actual + 1, fotos.length - 1));
    // Flechas del teclado (en la compu), con la ficha abierta.
    $("ficha").onkeydown = (e) => {
      if (e.key === "ArrowRight") { e.preventDefault(); sig.onclick(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); ant.onclick(); }
    };
    caja.replaceChildren(pista, ant, sig, puntos);
    marcar();
  }

  function abrirFicha(p) {
    galeria(p);
    const cerrar = el("button", "cerrar", "×");
    cerrar.setAttribute("aria-label", "Cerrar");
    cerrar.onclick = () => $("ficha").close();
    $("ficha-foto").append(cerrar);
    $("ficha-marca").textContent = p.marca;
    $("ficha-nombre").textContent = p.nombre;
    const d = $("ficha-datos");
    d.replaceChildren(el("span", "", p.categoria));
    if (p.sku) d.append(el("span", "", "Código: " + p.sku));
    $("ficha-caract").textContent = p.caracteristicas;
    $("ficha-caract").hidden = !p.caracteristicas;
    const link = linkWhatsapp(`Hola, quiero consultar por ${p.nombre}${p.sku ? ` (SKU ${p.sku})` : ""}`);
    $("ficha-wsp").hidden = !link;
    if (link) $("ficha-wsp").href = link;
    $("ficha").showModal();
    cerrar.focus({ preventScroll: true });  // como con una sola foto (si no, el foco cae en la galería)
    // Enlace propio del producto (para compartirlo): ...#p=CODIGO
    if (p.sku) history.replaceState(null, "", "#p=" + encodeURIComponent(p.sku));
  }

  function pie() {
    const n = estado.datos.negocio, pie = $("pie");
    pie.append(el("div", "nombre-local", "El Bote del Pescador"));
    if (n.direccion) pie.append(el("div", "", n.direccion));
    if (n.whatsapp) {
      const a = el("a", "", "WhatsApp " + n.whatsapp_visible);
      a.href = linkWhatsapp("Hola, quería hacer una consulta"); a.target = "_blank"; a.rel = "noopener";
      const d = el("div"); d.append(a); pie.append(d);
    }
    if (estado.datos.actualizado) {
      const f = new Date(estado.datos.actualizado);
      pie.append(el("div", "actualizado", "Actualizado el " + f.toLocaleDateString("es-AR") + " a las " +
        f.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })));
    }
  }

  function cerrarCategorias() {
    $("chips").classList.remove("abierta");
    $("cat-boton").setAttribute("aria-expanded", "false");
  }
  $("cat-boton").onclick = () => {
    const abrir = !$("chips").classList.contains("abierta");
    $("chips").classList.toggle("abierta", abrir);
    $("cat-boton").setAttribute("aria-expanded", String(abrir));
  };
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#chips, #cat-boton")) cerrarCategorias();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarCategorias(); });

  // Eventos
  let espera;
  $("q").addEventListener("input", (e) => {
    clearTimeout(espera);
    $("limpiar").hidden = !e.target.value;
    espera = setTimeout(() => { estado.q = e.target.value; estado.mostrados = POR_TANDA; actualizar(); }, 150);
  });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
  $("limpiar").onclick = () => {
    $("q").value = ""; $("limpiar").hidden = true; estado.q = ""; estado.mostrados = POR_TANDA; actualizar(); $("q").focus();
  };
  $("mas").onclick = () => { estado.mostrados += POR_TANDA; actualizar(); };
  $("ficha").addEventListener("close", () => {
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  });
  $("ficha").addEventListener("click", (e) => { if (e.target === $("ficha")) $("ficha").close(); });
  new IntersectionObserver(([e]) => { if (e.isIntersecting && !$("mas").hidden) $("mas").click(); }, { rootMargin: "400px" })
    .observe($("mas"));
  const barra = $("barra");
  addEventListener("scroll", () => barra.classList.toggle("pegada", barra.getBoundingClientRect().top <= 0 && scrollY > 60), { passive: true });

  fetch("datos.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((datos) => {
      datos.productos.forEach((p) => { p._texto = normal([p.nombre, p.marca, p.sku, p.categoria, p.caracteristicas].join(" ")); });
      estado.datos = datos;
      const fl = $("flotante"), link = linkWhatsapp("Hola, quería hacer una consulta");
      if (link) { fl.href = link; fl.hidden = false; }
      dibujarChips(); pie(); actualizar();
      const m = location.hash.match(/^#p=(.+)$/);
      const elegido = m && datos.productos.find((p) => p.sku === decodeURIComponent(m[1]));
      if (elegido) abrirFicha(elegido);
    })
    .catch(() => { $("contador").textContent = "No se pudo cargar el catálogo. Probá de nuevo en un rato."; });
})();
</script>
</body>
</html>
